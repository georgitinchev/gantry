apiVersion: v1
kind: Namespace
metadata:
  name: gitops
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: gitops
  labels: {app: git-server}
spec:
  replicas: 1
  selector: {matchLabels: {app: git-server}}
  template:
    metadata:
      labels: {app: git-server}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: git
          image: gantry/git-server:dev
          imagePullPolicy: Never
          ports: [{name: git, containerPort: 9418}]
          readinessProbe: {tcpSocket: {port: git}, periodSeconds: 3}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: repos, mountPath: /srv/git}]
      volumes: [{name: repos, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: gitops
spec:
  selector: {app: git-server}
  ports: [{name: git, port: 9418, targetPort: git}]
