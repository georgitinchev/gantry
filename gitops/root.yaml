# App of apps. Everything below gitops/apps is managed by Argo CD from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gantry
  namespace: argocd
  annotations:
    # Diff against what the API server would store, so defaulted fields on the
    # child Applications and the ApplicationSet don't show up as drift.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: git://git-server.gitops.svc.cluster.local/gantry.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
