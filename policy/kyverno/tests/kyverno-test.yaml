apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gantry-policies
policies:
  - ../require-approval-for-large.yaml
  - ../tenant-image-hygiene.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: require-approval-for-large
    resources: [team-large-unapproved]
    kind: AppEnvironment
    result: fail
  - policy: require-approval-for-large
    resources: [team-large-approved, team-small]
    kind: AppEnvironment
    result: pass
  - policy: tenant-image-hygiene
    resources: [pinned, digest]
    kind: Pod
    result: pass
  - policy: tenant-image-hygiene
    resources: [latest, untagged, untrusted]
    kind: Pod
    result: fail
